<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>NoxStream — Film</title>
<style>
:root{--bg:#050608;--panel:#0b0d11;--text:#f5f5f2;--muted:#8b919d;--gold:#d8b66d;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.hero{min-height:620px;position:relative;overflow:hidden;background:#080a0d}.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;filter:brightness(.48)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,5,7,.96),rgba(4,5,7,.60) 45%,rgba(4,5,7,.12)),linear-gradient(0deg,#050608,transparent 48%)}.top{position:absolute;top:0;left:0;right:0;height:72px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 5vw}.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(12,14,18,.78);color:#fff;font-size:20px}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}.heroInfo{position:relative;z-index:5;padding:0 8vw 72px;max-width:780px}.meta{color:#c5c8cf;font-size:12px;display:flex;gap:14px;flex-wrap:wrap}.title{font-size:clamp(42px,8vw,90px);line-height:.92;letter-spacing:-4px;font-weight:950;margin:14px 0}.watch{margin-top:22px;border:0;border-radius:11px;padding:14px 20px;background:#f4f3ef;color:#111;font-weight:900}.content{padding:35px 8vw 70px;max-width:1100px}.section{padding:20px 0;border-bottom:1px solid var(--line)}h2{font-size:24px;margin:0 0 14px}.desc{color:#b3b7c0;line-height:1.7}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fact{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}.fact small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.fact b{font-size:12px}.player{margin-top:30px}.playerBox{aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}.playerBox iframe{width:100%;height:100%;border:0}.back{display:inline-block;margin-top:25px;color:var(--gold);font-weight:800}.nox-kfp-preview{position:absolute;inset:0;z-index:20;width:100%;height:100%;background:#000;border-radius:inherit;overflow:hidden;opacity:0;transition:opacity .35s ease}.nox-kfp-preview.visible{opacity:1}.nox-kfp-preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.nox-kfp-mute{position:absolute;right:10px;bottom:10px;z-index:30;width:38px;height:38px;padding:0;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(0,0,0,.72);color:#fff;font-size:16px}
@media(max-width:600px){.facts{grid-template-columns:1fr 1fr}.hero{min-height:560px}.title{font-size:42px}}
</style>
</head>
<body>
<div class="hero"><img id="poster" alt=""><div class="top"><button class="icon" onclick="history.back()">‹</button><div class="brand">Nox<span>Stream</span></div><button class="icon" onclick="share()">↗</button></div><div class="heroInfo"><div id="meta" class="meta"></div><div id="title" class="title"></div><button class="watch" onclick="openFilmDirect()">▶ &nbsp; Regarder maintenant</button></div></div>
<main class="content"><section class="section"><h2>Détails</h2><div id="desc" class="desc"></div></section><div id="facts" class="facts"></div><section class="player"><h2>Lecteur</h2><div class="playerBox"><iframe id="video" title="Lecteur vidéo Uqload" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen webkitallowfullscreen playsinline referrerpolicy="no-referrer"></iframe></div></section><a class="back" href="/">← Retour à NoxStream</a></main>
<script>
(async function(){
'use strict';
const q=new URLSearchParams(location.search),name=(q.get('name')||'').trim();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function posterUrl(p){if(!p)return '';if(/^https?:\/\//i.test(p))return p;return '/'+String(p).replace(/^\.\//,'').split('/').map(encodeURIComponent).join('/')}
try{
 const html=await fetch('/index.html',{cache:'no-store'}).then(r=>r.text());
 const m=html.match(/const films=(\[[\s\S]*?\]);const p=/); if(!m)throw Error('Catalogue introuvable');
 const films=JSON.parse(m[1]); const wanted=name.toLowerCase(); const f=films.find(x=>String(x.name||'').trim().toLowerCase()===wanted)||films[0];
 if(!f)return;
 window.noxCurrentFilm=f;
 document.title='NoxStream — '+f.name;
 document.getElementById('title').textContent=f.name||'';
 document.getElementById('poster').src=posterUrl(f.poster);
 document.getElementById('poster').alt=f.name||'';
 document.getElementById('meta').innerHTML=[f.year,f.time,f.quality].filter(Boolean).map(esc).map(x=>'<span>'+x+'</span>').join('');
 document.getElementById('desc').textContent=String(f.desc||'—').replace(/Si vous rencontrez des problèmes de lecture, veuillez désactiver adblock.*$/i,'').trim()||'—';
 document.getElementById('facts').innerHTML=[['Genre',f.genre],['Origine',f.origin],['Réalisateur',f.director],['Acteurs',f.actors],['Langue',f.lang],['Qualité',f.quality]].filter(x=>x[1]).map(x=>'<div class="fact"><small>'+esc(x[0])+'</small><b>'+esc(x[1])+'</b></div>').join('');
 window.openFilmDirect=function(){if(f.playerUrl)location.href=f.playerUrl;};
 window.share=async function(){try{await navigator.clipboard.writeText(location.href);alert('Lien copié');}catch(e){}};
 const frame=document.getElementById('video'); if(f.playerUrl)frame.src=f.playerUrl;
 const trailers={'Kung Fu Panda 2':'FQ63rqSRrEI','The Last Day':'MpykB_5IMec'}; const trailer=trailers[f.name];
 if(trailer){const art=document.querySelector('.hero');let timer=null,preview=null,player=null;function stop(){clearTimeout(timer);timer=null;if(preview)preview.remove();preview=null;try{if(player)player.stopVideo()}catch(e){}}function show(){if(preview)return;preview=document.createElement('div');preview.className='nox-kfp-preview';const fr=document.createElement('iframe');fr.title='Bande-annonce '+f.name;fr.allow='autoplay; fullscreen; picture-in-picture';fr.allowFullscreen=true;fr.src='https://www.youtube.com/embed/'+trailer+'?autoplay=1&mute=1&controls=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1';const mute=document.createElement('button');mute.className='nox-kfp-mute';mute.textContent='🔇';mute.onclick=function(){try{const on=mute.dataset.unmuted==='1';fr.contentWindow.postMessage(JSON.stringify({event:'command',func:on?'mute':'unMute',args:[]}),'*');mute.dataset.unmuted=on?'0':'1';mute.textContent=on?'🔇':'🔊'}catch(e){}};preview.append(fr,mute);art.appendChild(preview);requestAnimationFrame(()=>preview&&preview.classList.add('visible'))}timer=setTimeout(show,3000);addEventListener('pagehide',stop);addEventListener('beforeunload',stop)}
}catch(e){console.error(e);location.href='/';}
})();
</script>
</body></html>
