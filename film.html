<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>NoxStream — Film</title>
<style>
:root{--bg:#050608;--panel:#0b0d11;--text:#f5f5f2;--muted:#8b919d;--gold:#d8b66d;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{min-height:100vh}.hero{min-height:620px;position:relative;overflow:hidden;background:#080a0d}.hero>img#poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;filter:brightness(.48);transform:scale(1.01)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,5,7,.96),rgba(4,5,7,.60) 45%,rgba(4,5,7,.12)),linear-gradient(0deg,#050608,transparent 48%)}.top{position:absolute;top:0;left:0;right:0;height:72px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:linear-gradient(180deg,rgba(5,6,8,.9),transparent)}.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(12,14,18,.78);color:#fff;font-size:20px}.brand{font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}.heroInfo{position:relative;z-index:5;padding:0 8vw 72px;max-width:780px}.meta{color:#c5c8cf;font-size:12px;display:flex;gap:14px;flex-wrap:wrap}.title{font-size:clamp(42px,8vw,90px);line-height:.92;letter-spacing:-4px;font-weight:950;margin:14px 0}.rating{font-size:13px;color:#d9dbe0}.stars{color:var(--gold)}.watch{margin-top:22px;border:0;border-radius:11px;padding:14px 20px;background:#f4f3ef;color:#111;font-weight:900}.content{padding:35px 8vw 70px;max-width:1100px}.section{padding:20px 0;border-bottom:1px solid var(--line)}h2{font-size:24px;margin:0 0 14px}.desc{color:#b3b7c0;line-height:1.7}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fact{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}.fact small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.fact b{font-size:12px}.player{margin-top:30px}.playerBox{aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}.playerBox iframe{width:100%;height:100%;border:0}.back{display:inline-block;margin-top:25px;color:var(--gold);font-weight:800}.nox-preview{position:absolute;inset:0;z-index:20;opacity:0;transition:opacity .35s ease;background:#000;pointer-events:none}.nox-preview.visible{opacity:1}.nox-preview iframe{width:100%;height:100%;border:0}.nox-mute{position:absolute;right:14px;bottom:14px;z-index:30;width:42px;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(0,0,0,.72);color:#fff;cursor:pointer}
@media(max-width:700px){.hero{min-height:590px}.heroInfo{padding:0 6vw 55px}.facts{grid-template-columns:1fr}.content{padding-left:6vw;padding-right:6vw}.title{letter-spacing:-2px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero" id="hero"><img id="poster" alt=""><div class="top"><button class="icon" onclick="history.back()" aria-label="Retour">‹</button><div class="brand">Nox<span>Stream</span></div><button class="icon" onclick="shareFilm()" aria-label="Partager">↗</button></div><div class="heroInfo"><div id="meta" class="meta"></div><div id="title" class="title">Chargement…</div><div class="rating"><span class="stars">★★★★★</span> <b id="rating">—</b></div><button class="watch" onclick="document.getElementById('lecteur').scrollIntoView({behavior:'smooth'})">▶ &nbsp; Regarder maintenant</button></div></section>
<main class="content"><section class="section"><h2>Résumé</h2><div id="desc" class="desc">Chargement…</div></section><section class="section"><h2>Informations</h2><div class="facts"><div class="fact"><small>Année</small><b id="year">—</b></div><div class="fact"><small>Durée</small><b id="time">—</b></div><div class="fact"><small>Qualité</small><b id="quality">—</b></div><div class="fact"><small>Langue</small><b id="lang">—</b></div><div class="fact"><small>Origine</small><b id="origin">—</b></div><div class="fact"><small>Réalisateur</small><b id="director">—</b></div></div></section><section class="section"><h2>Acteurs principaux</h2><div id="actors" class="desc">—</div></section><section class="section player" id="lecteur"><h2>Lecteur</h2><div class="playerBox"><iframe id="video" title="Lecteur vidéo NoxStream" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen playsinline referrerpolicy="strict-origin-when-cross-origin"></iframe></div></section><a class="back" href="/">← Retour à NoxStream</a></main>
</div>
<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search),requested=(params.get('name')||'').trim();
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function posterUrl(p){if(!p)return '';if(/^https?:\/\//i.test(p))return p;if(p.startsWith('/'))return p;return '/'+p.replace(/^\.\//,'')}
function extractFilms(html){
  const marker='const films='; const start=html.indexOf(marker); if(start<0)throw Error('catalogue introuvable');
  let i=start+marker.length; while(/\s/.test(html[i]))i++; if(html[i]!=='[')throw Error('catalogue invalide');
  let depth=0,quote='',escp=false;
  for(;i<html.length;i++){const ch=html[i];if(quote){if(escp)escp=false;else if(ch==='\\')escp=true;else if(ch===quote)quote='';continue}if(ch==='"'||ch==="'"){quote=ch;continue}if(ch==='[')depth++;else if(ch===']'){depth--;if(depth===0){return JSON.parse(html.slice(start+marker.length,i+1));}}}
  throw Error('catalogue incomplet');
}
function trailerId(name){const n=String(name||'').trim();return {'Kung Fu Panda 2':'FQ63rqSRrEI','The Last Day':'MpykB_5IMec'}[n]||''}
let current=null,previewTimer=null,preview=null,frame=null;
function stopPreview(){if(previewTimer){clearTimeout(previewTimer);previewTimer=null}if(preview){preview.remove();preview=null}frame=null}
function startPreview(){if(!current||!trailerId(current.name))return;const hero=document.getElementById('hero');if(!hero||preview)return;const id=trailerId(current.name);preview=document.createElement('div');preview.className='nox-preview';frame=document.createElement('iframe');frame.title='Bande-annonce '+current.name;frame.setAttribute('allow','autoplay; fullscreen; picture-in-picture');frame.setAttribute('allowfullscreen','');frame.referrerPolicy='strict-origin-when-cross-origin';frame.src='https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&controls=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1';const mute=document.createElement('button');mute.className='nox-mute';mute.type='button';mute.textContent='🔇';mute.title='Activer le son';mute.onclick=function(e){e.preventDefault();e.stopPropagation();try{const on=mute.dataset.unmuted==='1';frame.contentWindow.postMessage(JSON.stringify({event:'command',func:on?'mute':'unMute',args:[]}), '*');mute.dataset.unmuted=on?'0':'1';mute.textContent=on?'🔇':'🔊';mute.title=on?'Activer le son':'Couper le son'}catch(_){} };preview.appendChild(frame);preview.appendChild(mute);hero.appendChild(preview);requestAnimationFrame(()=>{if(preview)preview.classList.add('visible')})}
function render(f){current=f;document.title='NoxStream — '+f.name;document.getElementById('poster').src=posterUrl(f.poster);document.getElementById('poster').alt=f.name;document.getElementById('title').textContent=f.name;document.getElementById('meta').innerHTML=esc(f.year||'')+' · '+esc(f.genre||'')+' · '+esc(f.time||'');document.getElementById('desc').textContent=f.desc||'—';document.getElementById('year').textContent=f.year||'—';document.getElementById('time').textContent=f.time||'—';document.getElementById('quality').textContent=f.quality||'—';document.getElementById('lang').textContent=f.lang||'—';document.getElementById('origin').textContent=f.origin||'—';document.getElementById('director').textContent=f.director||'—';document.getElementById('actors').textContent=f.actors||'—';document.getElementById('rating').textContent='7.1/10';const video=document.getElementById('video');if(f.playerUrl)video.src=f.playerUrl;else video.removeAttribute('src');previewTimer=setTimeout(startPreview,3000)}
fetch('/index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('index');return r.text()}).then(extractFilms).then(films=>{const wanted=requested.toLowerCase();let f=films.find(x=>String(x.name||'').trim().toLowerCase()===wanted);if(!f&&params.get('i')!==null)f=films[Number(params.get('i'))];if(!f)f=films[0];if(!f)throw Error('film');render(f)}).catch(err=>{document.getElementById('title').textContent='Film introuvable';document.getElementById('desc').textContent='Impossible de charger cette fiche pour le moment.';console.error(err)});
window.addEventListener('pagehide',stopPreview);window.addEventListener('beforeunload',stopPreview);
window.shareFilm=function(){try{navigator.share({title:document.title,url:location.href})}catch(_){try{navigator.clipboard.writeText(location.href)}catch(__){}}};
})();
</script>
</body>
</html>
